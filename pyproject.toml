[project]
name = "portcast-quota"
version = "0.1.0"
description = "Per-customer quota metering service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "redis>=5.0",
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "locust>=2.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
